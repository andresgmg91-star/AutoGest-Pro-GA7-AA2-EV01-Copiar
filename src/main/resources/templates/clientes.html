
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes - AutoGest Pro</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f2f5f3;
            color: #26352b;
        }

        header {
            background: #174b32;
            color: white;
            padding: 22px 6%;
        }

        main {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .panel {
            background: white;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 10px #0001;
        }

        .formulario {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button, .volver {
            background: #207447;
            color: white;
            border: 0;
            border-radius: 6px;
            padding: 12px 18px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
        }

        .mensaje {
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 6px;
        }

        .exito {
            background: #dff4e5;
            color: #176333;
        }

        .error {
            background: #fde8e7;
            color: #9d2929;
        }

        .tabla {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #eaf1ec;
        }
    </style>
</head>

<body>

<header>
    <h1>AutoGest Pro</h1>
    <p>Gestión de clientes</p>
</header>

<main>

    <section class="panel">
        <h2>Registrar cliente</h2>
        <p>Completa los datos para registrar un cliente del taller.</p>

        <div th:if="${mensaje}" class="mensaje exito"
             th:text="${mensaje}"></div>

        <div th:if="${error}" class="mensaje error"
             th:text="${error}"></div>

        <form action="/clientes/guardar" method="post">
            <div class="formulario">

                <div>
                    <label for="tipoDocumento">Tipo de documento</label>
                    <select id="tipoDocumento" name="tipoDocumento" required>
                        <option value="">Selecciona</option>
                        <option value="CC">Cédula de ciudadanía</option>
                        <option value="CE">Cédula de extranjería</option>
                        <option value="NIT">NIT</option>
                        <option value="TI">Tarjeta de identidad</option>
                        <option value="Pasaporte">Pasaporte</option>
                    </select>
                </div>

                <div>
                    <label for="numeroDocumento">Número de documento</label>
                    <input id="numeroDocumento" name="numeroDocumento"
                           type="text" maxlength="30" required>
                </div>

                <div>
                    <label for="nombres">Nombres</label>
                    <input id="nombres" name="nombres"
                           type="text" maxlength="100" required>
                </div>

                <div>
                    <label for="apellidos">Apellidos</label>
                    <input id="apellidos" name="apellidos"
                           type="text" maxlength="100" required>
                </div>

                <div>
                    <label for="telefono">Teléfono</label>
                    <input id="telefono" name="telefono"
                           type="tel" maxlength="30">
                </div>

                <div>
                    <label for="correo">Correo electrónico</label>
                    <input id="correo" name="correo"
                           type="email" maxlength="150">
                </div>

                <div>
                    <label for="direccion">Dirección</label>
                    <input id="direccion" name="direccion"
                           type="text" maxlength="200">
                </div>

            </div>

            <button type="submit">Guardar cliente</button>
            <a class="volver" href="/dashboard">Volver al panel</a>
        </form>
    </section>

    <section class="panel">
        <h2>Clientes registrados</h2>

        <div class="tabla">
            <table>
                <thead>
                    <tr>
                        <th>Documento</th>
                        <th>Nombre completo</th>
                        <th>Teléfono</th>
                        <th>Correo</th>
                    </tr>
                </thead>

                <tbody>
                    <tr th:each="cliente : ${clientes}">
                        <td th:text="${cliente.tipoDocumento + ' ' + cliente.numeroDocumento}"></td>
                        <td th:text="${cliente.nombres + ' ' + cliente.apellidos}"></td>
                        <td th:text="${cliente.telefono}"></td>
                        <td th:text="${cliente.correo}"></td>
                    </tr>
                </tbody>
            </table>

            <p th:if="${clientes != null and #lists.isEmpty(clientes)}">
                Todavía no hay clientes registrados.
            </p>
        </div>
    </section>

</main>

</body>
</html>

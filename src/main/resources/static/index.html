
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoGest Pro</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        .contenedor {
            width: 90%;
            max-width: 430px;
            padding: 35px;
            background: white;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .logo {
            font-size: 42px;
            margin-bottom: 10px;
        }

        h1 {
            margin-bottom: 8px;
            color: #166534;
        }

        p {
            color: #64748b;
            line-height: 1.5;
        }

        .boton {
            display: inline-block;
            margin-top: 18px;
            padding: 12px 24px;
            background: #15803d;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .boton:hover {
            background: #166534;
        }
    </style>
</head>

<body>
    <main class="contenedor">
        <div class="logo">🚘</div>

        <h1>AutoGest Pro</h1>

        <p>
            Sistema de gestión para talleres automotrices.
        </p>

        <p>
            Bienvenido a la versión web de nuestro proyecto.
        </p>

        <a class="boton" href="/login.html">Ingresar al sistema</a>
    </main>
</body>
</html>
